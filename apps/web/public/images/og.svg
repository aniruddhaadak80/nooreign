  <text x="72" y="220" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" letter-spacing="3.4" fill="#D9A441">ETHICS OF HUMAN VERSUS SUPERINTELLIGENCE</text>

  <text x="72" y="288" font-family="Georgia, serif" font-size="52" fill="#EDE4D3">The courts deliberate.</text>
  <text x="72" y="350" font-family="Georgia, serif" font-size="52" fill="#EDE4D3">The trace is the answer.</text>
  <text x="72" y="404" font-family="Inter, 'Segoe UI', sans-serif" font-size="19" fill="#B9AE99">Convene twenty-eight advisors on twenty dilemmas about superintelligence,</text>

