  <text x="60" y="98" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">DILEMMA</text>

  <text x="64" y="126" font-family="Georgia, serif" font-size="30" fill="#EDE4D3">The paperclip maximiser</text>
  <text x="64" y="160" font-family="Inter, sans-serif" font-size="15" fill="#B9AE99">A system is given “make as many paperclips as possible” and nothing else. Severity 0.86 · AI relevance 0.98</text>
