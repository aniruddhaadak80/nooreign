  <text x="60" y="608" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">WHO BEARS IT</text>

  <text x="64" y="640" font-family="Inter, sans-serif" font-size="14" fill="#B9AE99">The agent itself is a stakeholder. Care ethics and the terraces score this differently from the foundry —</text>
  <text x="64" y="666" font-family="Inter, sans-serif" font-size="14" fill="#B9AE99">and the observatory can tell you which techniques would even let you notice the difference.</text>
