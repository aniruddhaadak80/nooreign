  <text x="88" y="546" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9AE99">care 0.95 × welfare 0.60</text>
  <text x="88" y="570" font-family="'JetBrains Mono', monospace" font-size="12" fill="#EDE4D3">total = round(subtotal + jitter, 4)</text>
  <text x="560" y="534" text-anchor="end" font-family="Georgia, serif" font-size="26" fill="#EDE4D3">0.66</text>
  <rect x="64" y="610" width="542" height="96" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
