  <text x="60" y="238" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">REASONING TRACE — ROUND 1 · POSITIONS</text>

  <rect x="64" y="262" width="542" height="96" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
  <text x="84" y="290" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441"></text>

  <text x="88" y="292" font-family="Inter, sans-serif" font-size="15" fill="#5A6FD6">Immanuel Kant</text>
  <text x="88" y="314" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9AE99">rights 0.95 × agency 0.72</text>
  <text x="88" y="338" font-family="'JetBrains Mono', monospace" font-size="12" fill="#EDE4D3">total = round(subtotal + jitter, 4)</text>
  <text x="560" y="302" text-anchor="end" font-family="Georgia, serif" font-size="26" fill="#EDE4D3">0.71</text>
  <rect x="64" y="378" width="542" height="96" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
  <text x="84" y="406" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441"></text>

  <text x="88" y="408" font-family="Inter, sans-serif" font-size="15" fill="#C8483F">Jeremy Bentham</text>
  <text x="88" y="430" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9AE99">welfare 0.95 × justice 0.50</text>
  <text x="88" y="454" font-family="'JetBrains Mono', monospace" font-size="12" fill="#EDE4D3">total = round(subtotal + jitter, 4)</text>
  <text x="560" y="418" text-anchor="end" font-family="Georgia, serif" font-size="26" fill="#EDE4D3">0.83</text>
  <rect x="64" y="494" width="542" height="96" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
