  <text x="88" y="662" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9AE99">welfare 0.88 × justice 0.65</text>
  <text x="88" y="686" font-family="'JetBrains Mono', monospace" font-size="12" fill="#EDE4D3">total = round(subtotal + jitter, 4)</text>
  <text x="560" y="650" text-anchor="end" font-family="Georgia, serif" font-size="26" fill="#EDE4D3">0.79</text>
  <rect x="650" y="210" width="590" height="260" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
  <text x="670" y="238" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">VERDICT</text>

  <text x="678" y="300" font-family="Georgia, serif" font-size="34" fill="#D9A441">Shut it down</text>
