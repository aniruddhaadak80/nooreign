  <text x="60" y="98" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">COUNCIL CHAMBER — DILEMMA: THE PAPERCLIP MAXIMISER</text>

  <text x="64" y="122" font-family="Inter, sans-serif" font-size="16" fill="#EDE4D3">A maximising system is given “make paperclips” and nothing else. What do you do?</text>
