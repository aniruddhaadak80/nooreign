  <text x="678" y="366" font-family="Inter, sans-serif" font-size="14" fill="#B9AE99">3 of 4 advisors agree · 1 dissent recorded</text>
  <rect x="650" y="490" width="590" height="240" rx="10" fill="#0E1730" fill-opacity="0.7" stroke="#1E2C4D" />
  <text x="670" y="518" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#D9A441">OBJECTIONS — ROUND 2</text>

  <text x="678" y="540" font-family="Inter, sans-serif" font-size="13" fill="#B9AE99">— Bentham: the objective is trivial; refit it and the welf</text>
  <text x="678" y="600" font-family="Inter, sans-serif" font-size="13" fill="#B9AE99">— Bostrom: a shutdown button in reach is a shutdown button</text>
