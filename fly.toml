# Fly.io deployment for the Next.js atlas.
#
#   fly launch --copy-config --no-deploy
#   fly secrets set NOOREIGN_SERVICE_URL=...   # only if the agents service is up
#   fly deploy
#
# REGION: bom (Mumbai) is the primary region. The atlas is read-heavy, static-ish
# and has no persistent state, so a single small region is enough — and bom keeps
# round-trip latency low for the largest share of readers. Add a second region
# only if origin health actually demands it; there is no database to be close to.
app = "nooreign"
primary_region = "bom"

# The repo Dockerfile already emits the Next.js `standalone` server (see the
# runner stage). Fly builds that same Dockerfile, so the machine runs exactly the
# image CI built — no second, differently-configured build step here.
[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # The atlas must not phone home, least of all from production infrastructure.
  NEXT_TELEMETRY_DISABLED = "1"
  # Required by the standalone server; 0.0.0.0 or the proxy cannot reach it.
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  # EMPTY by default. The atlas is fully functional without the Python
  # deliberation service — deliberation is computed in the browser by
  # packages/core. Set this to the agents service URL to enable live commentary.
  NOOREIGN_SERVICE_URL = ""
  NEXT_PUBLIC_NOOREIGN_SERVICE_URL = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero: a philosophical atlas is not a trading desk, and a stopped
  # machine costs nothing while the content is fully static.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Fly's health checks are part of routing: a machine failing this is removed
  # from the load balancer, so this must test the HTTP surface (/api/healthz),
  # not just that the process is alive.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1