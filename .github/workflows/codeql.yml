name: CodeQL

on:
  # Weekly, off the busiest hour, plus every push to main. Security scanning on a
  # schedule catches advisories published between deploys.
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Without this the analyze step gets "Resource not accessible by integration"
  # when it tries to upload results: the default token cannot write to the code
  # scanning API on a public repository.
  security-events: write

# Weekly runs are additive: never cancel one that is already scanning.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # Neither language needs a build step: JS/TS is analysed statically
          # (autobuild is unsupported for javascript-typescript) and the
          # agents service is a FastAPI app whose sources are analysed
          # statically.
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"