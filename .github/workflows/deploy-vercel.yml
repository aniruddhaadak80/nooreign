name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Vercel OIDC / deployment identity

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: production deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      # Pulled from GitHub secrets, never committed. Create them in
      # Repo → Settings → Secrets and variables → Actions:
      #   VERCEL_TOKEN      — a Vercel access token (Account Settings → Tokens)
      #   VERCEL_ORG_ID     — the org/team id (Vercel project Settings → General)
      #   VERCEL_PROJECT_ID — the project id  (Vercel project Settings → General)
      # The deploy steps below expand ${{ secrets.* }} — there is no token here.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # `vercel pull` materialises .vercel/project.json and the env for the
      # project, so `vercel build`/`deploy` do not need the CLI to guess linkage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project configuration and env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Build here and deploy the prebuilt output, so the artifact we ship is
      # exactly the artifact we tested — no second, differently-configured build
      # inside the Vercel builder.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Report the deployment
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.stdout }}
        run: |
          {
            echo "## Vercel deployment"
            echo
            echo '```'
            echo "$DEPLOY_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"