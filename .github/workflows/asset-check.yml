name: Asset reproducibility check

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: generated SVG assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Every committed SVG (banner, logo, social card, favicon, crests,
      # portraits, terrain) is generated from seed 2406 and committed. This job
      # regenerates them and fails on any diff, so a hand-edited asset or a
      # generator change that was not re-run can never merge — the repo stays
      # reproducible from the seed alone.
      - name: Regenerate assets
        run: bun run assets

      - name: Fail if committed assets drifted
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::Generated assets are out of date. Run 'bun run assets' locally and commit the result."
            exit 1
          fi
          echo "Committed assets match 'bun run assets' output."